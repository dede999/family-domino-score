# Verifica formatação, avisos do clippy e testes a cada push e PR.
# O teste da interface (tools/ui_test.py) fica de fora: ele usa o Safari.
name: CI

# Mudança só em docs ou ferramentas de teste não roda o CI, e por isso
# também não dispara o deploy (ver deploy.yml), que publicaria uma versão
# idêntica.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "tools/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "tools/**"
      - ".gitignore"

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --check

      # O app compila duas vezes: o servidor e a parte do navegador.
      - name: Clippy (servidor)
        run: cargo clippy --features server --all-targets -- -D warnings

      - name: Clippy (navegador)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Testes
        run: cargo test --features server
