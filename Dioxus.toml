[application]
name = "placar"
# App Android: espaço das barras do sistema (ver o arquivo).
android_main_activity = "android/MainActivity.kt"

[web.app]
title = "Placar de Dominó"

# Em release, o dx bundle grava um .br (Brotli) ao lado de cada arquivo da
# interface, e o servidor entrega o .br a quem aceita: o wasm cai de ~3 MB
# para uma fração disso, o que pesa no 4G.
[web]
pre_compress = true

# App Android. O identificador não pode mudar depois de publicado na Play
# Store: é ele que diz que uma versão nova é atualização do mesmo app.
[bundle]
identifier = "com.santamariasoftware.placar"
publisher = "Santa Maria Software"

[android]
min_sdk = 24
# A Play Store exige um nível recente (36 desde agosto de 2026).
target_sdk = 36
compile_sdk = 36
proguard_rules = ["android/proguard.pro"]
