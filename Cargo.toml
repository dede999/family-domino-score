[package]
name = "placar"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "=0.7.10", features = ["router", "fullstack"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

# web-only
gloo-timers = { version = "0.3", features = ["futures"], optional = true }

# server-only
libsql = { version = "0.9.30", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
argon2 = { version = "0.5.3", optional = true }
rand = { version = "0.8", optional = true }

[features]
default = ["web"]
web = ["dioxus/web", "dep:gloo-timers"]
server = ["dioxus/server", "dep:libsql", "dep:tokio", "dep:argon2", "dep:rand"]
